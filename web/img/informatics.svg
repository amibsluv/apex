  <g font-family="Consolas, monospace" font-size="34">
    <text x="190" y="290" fill="#a78bfa">def</text><text x="260" y="290" fill="#ffffff"> fib(n):</text>
    <text x="230" y="345" fill="#a78bfa">if</text><text x="275" y="345" fill="#ffffff"> n &lt; 2:</text>
    <text x="270" y="400" fill="#38bdf8">return</text><text x="400" y="400" fill="#1de9b6"> n</text>
