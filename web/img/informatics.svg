  <g font-family="Consolas, monospace" font-size="26" fill="#1de9b6" fill-opacity="0.18">
    <text x="30" y="60">01001011 10110010 01101001 00111010 11001010 01010110</text>
    <text x="30" y="110">def solve(n): return sum(i * i for i in range(n))</text>
